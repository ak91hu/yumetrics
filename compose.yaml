services:
  database:
    image: postgres:17
    environment:
      POSTGRES_DB: yumetrics
      POSTGRES_USER: yumetrics
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?Set LOCAL_POSTGRES_PASSWORD for local development}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - yumetrics-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yumetrics -d yumetrics"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  yumetrics-postgres:
